# Global settings
global:
  appName: "shopnow-shopping-cart-service"
  namespace: "shopnow"
  enabledComponents:
    configmap: true
    service: true
    ingress: true

# Deployment
#
# repository is intentionally empty: the Argo CD Application supplies it, so the
# account id lives in exactly one place. See shopnow-cart-service-config/base.
image:
  repository: ""
  tag: "v1"
  pullPolicy: Always

# 2, not 1. Below 2 the PodDisruptionBudget is skipped and a single spot
# interruption takes the whole service down.
replicaCount: 2
revisionHistoryLimit: 10
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 25%

# Scheduling. Sends pods to node pool 2 (ms-od / ms-spot), which carries both
# the label and the matching taint - see gitops/platform/nodepools.
nodeSelector:
  workload: microservices
tolerations:
  - key: workload
    operator: Equal
    value: microservices
    effect: NoSchedule

terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Cart state lives in Postgres, not on disk. Nothing to share between replicas.
persistence:
  enabled: false
  storageClass: efs-sc
  size: 5Gi
  mountPath: /data

service:
  type: ClusterIP
  port: 5863
  targetPort: 5863

# Ingress joins the shared eks-workload ALB on its own listener port.
#   http://<alb-dns>:5863
ingress:
  className: "alb"
  host: ""
  path: "/"
  pathType: Prefix
  groupName: "eks-workload"
  groupOrder: 70
  listenPorts: '[{"HTTP": 5863}]'
  inboundCidrs: "103.199.54.109/32"
  healthcheckPath: "/"
  successCodes: "200-404"

configmap:
  data: {}

serviceAccount:
  create: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
